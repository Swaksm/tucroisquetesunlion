# Le site a déménagé sur https://swaks.org/lion-meme/
# Redirection permanente (301) de toutes les anciennes adresses : Google transfère le référencement.
[build]
  command = "echo 'Site déplacé vers swaks.org/lion-meme/'"
  publish = "redirect"

[[redirects]]
  from = "/*"
  to = "https://swaks.org/lion-meme/"
  status = 301
  force = true
